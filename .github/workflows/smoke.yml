# Smoke test cross-OS do Nirvana-OS engine.
#
# Motivation: the 4 Windows bugs of 2026-07 (Bun's mkdir EEXIST, GNU tar
# treating "C:" as a remote host, symlinks without privilege, silent errors)
# only showed up on a customer's machine. This workflow reproduces the real
# environment: bash shell on ALL OSes — on Windows that is Git Bash, where tar is
# GNU tar, exactly as Claude Code runs there.
#
# Runs in this repo (public-primary since 2026-08-12) — the guards [ -f ... ]
# survive for partial checkouts and for the installed tarball.
name: smoke
on:
  # One run per change: `push` only on main (post-merge); working branches
  # get CI through `pull_request` below. Before, a push on a `feat/**` branch
  # with an open PR triggered two full runs and the merge waited for both.
  push:
    branches: [main]
  # Fork PRs: `pull_request` (never pull_request_target) — runs the
  # contributor's code WITHOUT secrets and without a write token. It gives CI
  # feedback to contributors, and is safe by construction.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun.lock` or nothing. With no node_modules Bun auto-installs each
      # dependency from the package.json RANGE at import time, so `zod: ^4.4.0`
      # resolved to 4.5.1 on the day it was published — and 4.5.0 had made the
      # seconds group of `z.string().datetime()` mandatory, which moved the
      # `pattern` inside two generated JSON Schemas without a line of
      # validators.ts changing. The parity gate compares committed bytes, so it
      # went red deterministically against a tree nobody could reproduce: every
      # checkout that installs from the lockfile gets 4.4.3 and passes.
      - name: Install the pinned dependency tree
        run: bun install --frozen-lockfile

      - name: Instalar o engine da fonte (fresh HOME, não-interativo)
        run: bun scripts/install.ts

      - name: nrv index duas vezes (regressão mkdir EEXIST no Windows)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nrv index
          nrv index

      # Every test, not one directory. This step used to run
      # `bun test skills/harness/tests`, which left 15 files in
      # skills/_shared/tests, skills/businesses/tests and skills/squads/tests
      # unrun — including runtime-links.test.ts, the only behavioural test of
      # scripts/install.ts. A test that CI never executes is a comment.
      #
      # `--timeout`: Bun's 5 s default applies to HOOKS as well as tests, and 158
      # hooks across the suite delete install trees, start servers or open a
      # file-backed Run Kernel without an explicit budget. On windows-latest,
      # measured 20-35x slower at fsync, those cross 5 s and the file fails as
      # `(fail) (unnamed) — a beforeEach/afterEach hook timed out`, naming no
      # test, with every named test in it passing. The victim rotates with the
      # runner's speed: three different files in three runs recorded in
      # helpers/test-budgets.ts, plus glance-multi-target-projection (6257 ms)
      # and verify-install-hooks (6980 ms) here. The per-hook budgets in that
      # helper stay — they document which hooks are genuinely heavy — and this
      # raises the floor for the ones nobody has annotated yet. Headroom, not
      # slack: a hook that truly wedges still fails, only later.
      - name: unit — the whole suite
        run: bun test skills --timeout=30000

      - name: nrv doctor (warnings ok; falha crítica reprova)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          rc=0; nrv doctor || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "doctor reportou falha crítica (exit $rc)"; exit "$rc"
          fi

      - name: Tarball + bootstrap npx (regressão GNU tar "C:" como host remoto)
        run: |
          if [ ! -f scripts/build-engine-tarball.ts ] || [ ! -f packaging/cli/bin/cli.mjs ]; then
            echo "repo sem packaging/ (engine público) — step coberto pelo monorepo"; exit 0
          fi
          bun scripts/build-engine-tarball.ts
          NIRVANA_ENGINE_TARBALL="$PWD/dist/nirvana-os-engine.tar.gz" node packaging/cli/bin/cli.mjs

      # A skills.sh install lands the thin `nirvana` skill alone; its bootstrap
      # must put the engine on the machine from the same tarball. --update forces
      # the path past the "already installed" gate the earlier steps satisfied.
      - name: Bootstrap via the nirvana skill (same tarball, forced reinstall)
        run: |
          if [ ! -f skills/nirvana/scripts/bootstrap.sh ] || [ ! -f dist/nirvana-os-engine.tar.gz ]; then
            echo "sem skill nirvana ou sem tarball — step pulado"; exit 0
          fi
          export NIRVANA_ENGINE_TARBALL="$PWD/dist/nirvana-os-engine.tar.gz" NIRVANA_BOOTSTRAP_YES=1
          # --update on both: the earlier steps already installed the engine here,
          # and a bare --dry-run rightly answers "already installed" in that case.
          sh skills/nirvana/scripts/bootstrap.sh --dry-run --update | grep -q "dry run"
          sh skills/nirvana/scripts/bootstrap.sh --update | tee "$RUNNER_TEMP/boot.log"
          grep -q "Checksum verified" "$RUNNER_TEMP/boot.log"
          sh skills/nirvana/scripts/bootstrap.sh | grep -q "already installed"
          test -f "$HOME/.nirvana/skills/nirvana/SKILL.md"
          test ! -e "$HOME/.nirvana/skills/nirvana-os"
          test -f "$HOME/.squads-registry.json"

      - name: Bootstrap via the nirvana skill (PowerShell mirror)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NIRVANA_ENGINE_TARBALL = "$PWD\dist\nirvana-os-engine.tar.gz"
          $env:NIRVANA_BOOTSTRAP_YES = "1"
          $upd = powershell -NoProfile -ExecutionPolicy Bypass -File skills\nirvana\scripts\bootstrap.ps1 -Update | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host $upd; exit $LASTEXITCODE }
          if ($upd -notmatch "Checksum verified") { Write-Host $upd; exit 1 }
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File skills\nirvana\scripts\bootstrap.ps1 | Out-String
          if ($out -notmatch "already installed") { Write-Host $out; exit 1 }

  # The repository's contract gates. They used to run only on the machine of
  # whoever remembered to call them, which is not a gate — it is a suggestion.
  # Changelog parity was added here because the drift it detects (a release
  # written only in the main language) is invisible in review: each file looks
  # complete on its own. One operating system is enough: none of these checks
  # reads OS behavior.
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun.lock` or nothing. With no node_modules Bun auto-installs each
      # dependency from the package.json RANGE at import time, so `zod: ^4.4.0`
      # resolved to 4.5.1 on the day it was published — and 4.5.0 had made the
      # seconds group of `z.string().datetime()` mandatory, which moved the
      # `pattern` inside two generated JSON Schemas without a line of
      # validators.ts changing. The parity gate compares committed bytes, so it
      # went red deterministically against a tree nobody could reproduce: every
      # checkout that installs from the lockfile gets 4.4.3 and passes.
      - name: Install the pinned dependency tree
        run: bun install --frozen-lockfile

      - name: Gates de contrato (comandos, auditoria, inglês, changelog, pureza)
        run: |
          if [ ! -f scripts/check-changelog-parity.ts ]; then
            echo "checkout sem scripts/check-* — nada a verificar"; exit 0
          fi
          bun run check:all
