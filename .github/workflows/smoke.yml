# Smoke test cross-OS do Nirvana-OS engine.
#
# Motivação: os 4 bugs de Windows de 2026-07 (mkdir EEXIST do Bun, GNU tar
# tratando "C:" como host remoto, symlinks sem privilégio, erros mudos) só
# apareceram na máquina de um cliente. Este workflow reproduz o ambiente real:
# shell bash em TODOS os OS — no Windows isso é o Git Bash, onde o tar é o
# GNU tar, exatamente como o Claude Code roda lá.
#
# Roda neste repo (public-primary desde 2026-08-12) — os guards [ -f ... ]
# sobrevivem para checkouts parciais e para o tarball instalado.
name: smoke
on:
  push:
    branches: [main, "feat/**"]
  # PRs de fork: `pull_request` (nunca pull_request_target) — roda o código do
  # contribuidor SEM secrets e sem token de escrita. É o que dá feedback de CI
  # a quem contribui, e é seguro por construção.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar o engine da fonte (fresh HOME, não-interativo)
        run: bun scripts/install.ts

      - name: nrv index duas vezes (regressão mkdir EEXIST no Windows)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nrv index
          nrv index

      - name: Resolve required local browser
        shell: pwsh
        run: |
          $Candidates = switch ("${{ runner.os }}") {
            "Linux"   { @("/usr/bin/google-chrome", "/usr/bin/google-chrome-stable", "/usr/bin/chromium", "/usr/bin/chromium-browser") }
            "macOS"   { @("/Applications/Google Chrome.app/Contents/MacOS/Google Chrome", "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge") }
            "Windows" { @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe") }
            default   { throw "Unsupported runner OS: ${{ runner.os }}" }
          }
          $Browser = $Candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $Browser) { throw "Required Chrome, Chromium, or Edge executable is absent" }
          "GLANCE_TEST_BROWSER=$Browser" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          & $Browser --version

      # Every test, not one directory. This step used to run
      # `bun test skills/harness/tests`, which left 15 files in
      # skills/_shared/tests, skills/businesses/tests and skills/squads/tests
      # unrun — including runtime-links.test.ts, the only behavioural test of
      # scripts/install.ts. A test that CI never executes is a comment.
      - name: unit — the whole suite
        run: bun test skills

      - name: nrv doctor (warnings ok; falha crítica reprova)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          rc=0; nrv doctor || rc=$?
          if [ "$rc" -ge 2 ]; then
            echo "doctor reportou falha crítica (exit $rc)"; exit "$rc"
          fi

      - name: Tarball + bootstrap npx (regressão GNU tar "C:" como host remoto)
        run: |
          if [ ! -f scripts/build-engine-tarball.ts ] || [ ! -f packaging/cli/bin/cli.mjs ]; then
            echo "repo sem packaging/ (engine público) — step coberto pelo monorepo"; exit 0
          fi
          bun scripts/build-engine-tarball.ts
          NIRVANA_ENGINE_TARBALL="$PWD/dist/nirvana-os-engine.tar.gz" node packaging/cli/bin/cli.mjs

  # Os gates de contrato do repositório. Rodavam só na máquina de quem lembrasse
  # de chamá-los, o que não é gate — é sugestão. A paridade de changelog entrou
  # aqui porque a deriva que ela detecta (uma release escrita só no idioma
  # principal) é invisível em review: cada arquivo parece completo sozinho.
  # Um sistema operacional basta: nenhum destes checks lê comportamento de OS.
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Gates de contrato (comandos, auditoria, inglês, changelog, pureza)
        run: |
          if [ ! -f scripts/check-changelog-parity.ts ]; then
            echo "checkout sem scripts/check-* — nada a verificar"; exit 0
          fi
          bun run check:all
