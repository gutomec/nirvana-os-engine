# Canonical Capability Catalog v1
#
# Source of truth for the controlled vocabulary used in Squad Protocol v5
# (capabilities[].domains, capabilities[].id namespaces) and Business Protocol v1
# (business.capabilities, business.domains).
#
# Squads/businesses MAY use entries marked experimental: true for testing,
# but they receive a 0.7x score boost penalty in discovery and are excluded
# from cross-business routing.
#
# Governance:
# - Additions: PR against this file, reviewed by protocol authors
# - Removals: deprecation cycle of one minor version
# - Squads using removed entries are flagged at index time

version: "1.1.0"
protocol_compatibility:
  squad: "5.0"
  business: "1.0"
  harness: "1.0"
generated_at: "2026-08-05"
status: stable
# 1.1.0 (2026-08-05): namespace expansion reconciling the catalog with the live
# registry (649 capability providers measured 2026-08-05, 58% of ids using
# namespaces outside the 1.0.0 catalog). Adds 25 namespaces observed in real
# squads/businesses — practice writes domain-named prefixes (data_engineering,
# software_engineering, ...) alongside the short 1.0.0 forms (data, software).
# Adds the `design` domain (33 registry uses, 21 businesses). `general` stays
# non-canonical by design: it discriminates nothing in discovery.

