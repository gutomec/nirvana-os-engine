<!doctype html>
<html lang="en" data-theme="apple">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glance extension browser probe</title>
  <link rel="stylesheet" href="/extension-host.css">
  <style>
    body { margin: 0; font: 16px sans-serif; }
    #host-root { padding: 16px; }
    #extension-frame { width: 420px; height: 220px; border: 0; }
    #confirm:focus-visible, #focus-probe:focus-visible { outline: 2px solid rgb(0, 90, 255); outline-style: solid; }
    #cards { display: none; }
    #table { display: table; }
    @media (max-width: 759px) { #cards { display: grid; } #table { display: none; } }
  </style>
</head>
<body>
  <main id="host-root" class="glance-extension-host">
    <div id="status"></div>
    <div id="text"></div>
    <button id="focus-probe">Focus probe</button>
    <section id="navigation" class="glance-extension-navigation">
      <span id="pending"></span>
      <button id="confirm" class="glance-extension-confirm" hidden>Open GitHub</button>
      <button id="cancel" class="glance-extension-cancel" hidden>Cancel</button>
    </section>
    <div id="cards">Cards</div>
    <table id="table"><tbody><tr><td>Table</td></tr></tbody></table>
    <iframe id="extension-frame" class="glance-extension-frame" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
  </main>
  <script>window.__TEST_ENVELOPE__ = __ENVELOPE__;</script>
  <script type="module">
    import { mountExtensionHost } from "/extension-host.js";
    window.__audits = [];
    window.__monotonicOffset = 0;
    window.__openMode = "normal";
    window.__lastOpenedWindow = null;
    const iframe = document.getElementById("extension-frame");
    const confirmControl = document.getElementById("confirm");
    const cancelControl = document.getElementById("cancel");
    const host = mountExtensionHost({
      iframe,
      hostRoot: document.getElementById("host-root"),
      confirmControl,
      cancelControl,
      pendingTarget: document.getElementById("pending"),
      textTarget: document.getElementById("text"),
      statusTarget: document.getElementById("status"),
      extensionId: "fixture-ext",
      locale: "pt-BR",
      theme: "apple",
      tokens: {
        "surface-0": "#fff", "surface-1": "#f8f8f8", "surface-2": "#eee",
        "text-primary": "#111", "text-secondary": "#555", "border-default": "#ccc",
        "border-focus": "#06f", "accent": "#06f", "success-fg": "#070",
        "warn-fg": "#850", "danger-fg": "#b00", "space-2": "8px"
      },
      manifestHosts: ["github.com"],
      coreHosts: ["github.com"],
      audit: event => window.__audits.push(event),
      monotonicNow: () => performance.now() + window.__monotonicOffset,
      open: (url, target, features) => {
        if (window.__openMode === "failure") return null;
        const opened = window.open(url, target, features);
        window.__lastOpenedWindow = opened;
        return opened;
      },
      onActive: api => api.sendDataset("snapshot", window.__TEST_ENVELOPE__),
    });
    host.opener.renderStatus("Snapshot expired");
    window.__glanceHost = host;
    window.__hostMounted = true;
    iframe.src = "/iframe.html";
  </script>
</body>
</html>
