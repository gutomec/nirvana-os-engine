name: example-solo
version: 1.0.0
protocol: "2.0"
description: >
  Example solo business. Single-employee setup that works as a minimal proof
  of concept. Use as a base for custom businesses created through the wizard
  (*business init <name> --template solo).
author: businesses-skill
license: SUL-1.0
domains:
  - strategy
  - business_operations

# ── Routing metadata (skills/_shared/ROUTING_METADATA_CONTRACT.md) ──────────
# TODO: fill ALL fields below, then run the self-retrieval gate (blocking):
#   bun ~/.nirvana/skills/_shared/scripts/self-retrieval-gate.ts <slug>
# Creation is NOT done until the gate exits 0.
capabilities: []            # TODO: dotted capability ids this business fulfills (§2)
produces:                   # artifact-type slugs, kebab-case (§3)
  - todo-artifact-type
keywords:                   # synonym groups (§4): English, add other languages your clients write in
  - "TODO concept in English"
example_briefs:             # >=3; symptom-phrased; conjugated + infinitive verbs (§5)
  - "TODO: brief phrased as a real user ask, conjugated verb form"
  - "TODO: brief as the owner would write it in a panic, conjugated verb form"
  - "TODO: brief covering the infinitive form (I want to launch... / launch...)"
not_for:                    # exclusion fences (§6): 2-4 content words, 5-80 chars, no parentheses
  - "TODO: two-word fence"
  - "TODO: short fence"

authority_level: tier-3
run_budget_usd: 0            # per-run ceiling in USD; 0 = unlimited (v2 §6.11)
operation_mode: zero_human

runtime_requirements:
  policy: active
  minimum:
    - { runtime: claude-code, version: ">=1.0.0" }
  compatible:
    - { runtime: codex, version: ">=0.20.0" }
    - { runtime: gemini-cli, version: ">=0.4.0" }
    - { runtime: antigravity-cli, version: ">=0.4.0" }  # +antigravity-cli (successor; gemini-cli consumer sunset 2026-06-18)

features_required:
  - max_turns
  - tool_whitelist
  - subagent_spawning
  - handoff_artifacts
  - audit_trail

memory:
  permanent:
    enabled: true
    files:
      - permanent.md
    garbage_collection:
      max_facts: 200
      review_interval_days: 60
      conflict_resolution: replace
  project:
    isolation: by_construction

ui:
  client_facing_name: "Solo Business (Example)"
  category: general
  pitch: "Solo template: 1 CEO employee who does everything. Replace it with your real business."
