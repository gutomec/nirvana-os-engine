# Squad dependency manifest (sidecar to squad.yaml).
# The squad's Node and Python packages install into its own environment,
# ~/.nirvana/envs/<slug>/, which a dispatch prepares before the squad runs and
# `nrv activate` prepares ahead of time. Activation walks each section in order,
# checks what is already present, and installs only what is missing.
#
# Place at <squad>/dependencies.yaml. If the file is absent, the squad is
# assumed self-contained (no external installs needed).
#
# CLI:
#   nrv activate <slug>
#   nrv activate <slug> --dry-run
#   nrv activate <slug> --confirm-heavy
#
# Templates: copy this file and fill in only the sections that apply.

schema_version: "1.0"

# ─────────────────────────────────────────────────────────────
# System tools (CLIs that must be on PATH)
# ─────────────────────────────────────────────────────────────
system:
  - name: ffmpeg
    check: "ffmpeg -version"
    install:
      darwin: "brew install ffmpeg"
      linux: "sudo apt install -y ffmpeg"
      win32: "choco install ffmpeg -y"

  - name: git
    check: "git --version"
    install:
      darwin: "brew install git"
      linux: "sudo apt install -y git"

# ─────────────────────────────────────────────────────────────
# Python packages.
#
# They install into the squad's own venv, ~/.nirvana/envs/<slug>/.venv: never
# into the squad folder, never into ~/Library/Python, never with
# `pip install --user` (PEP 668 refuses that on Debian, Ubuntu, Fedora, Arch and
# Homebrew), and never into a venv another squad shares. The activator finds an
# interpreter by making it run (a dead `python` shim on PATH is skipped),
# creates the venv with uv when uv is installed and with `-m venv` otherwise,
# and installs again only when the declared packages change. Version specifiers
# are honoured: `pillow >= 10.0` is a real constraint. Declare the packages and
# nothing else; `target_dir` is ignored, and so is `use_squad_venv` (every
# squad is isolated now). The worker's prompt names the squad's interpreter.
# ─────────────────────────────────────────────────────────────
python:
  manager: pip      # uv | pip
  packages:
    - "openai>=2.0.0"
    - "pydantic>=2.0.0"

# ─────────────────────────────────────────────────────────────
# Node packages.
#
# They install into the squad's own environment, ~/.nirvana/envs/<slug>/: a
# package.json holding these entries with their versions exactly as written,
# installed with `bun install`. Two squads that pin different versions of a
# package each get theirs. The worker resolves them through NODE_PATH, a Node
# ESM resolve hook and an `npx` shim on PATH; the squad folder gets only a
# `node_modules` link to the environment, for tools that ignore NODE_PATH.
# Declare packages only: `cwd` is ignored (it used to point installs at the
# squad's own directory, which cost 276 MB per squad for the same packages).
#
# `global: true` is the exception, for a package that must be a COMMAND on the
# machine's PATH (`wrangler`, `lighthouse`). Those go through npm as before.
# ─────────────────────────────────────────────────────────────
# node:
#   packages:
#     - "yaml@^2"

# ─────────────────────────────────────────────────────────────
# External services (long-running daemons the squad calls)
# Activator clones + installs but does NOT start them.
# ─────────────────────────────────────────────────────────────
services:
  - name: comfyui
    repo: "https://github.com/comfyanonymous/ComfyUI.git"
    install_dir: "~/.nirvana/services/comfyui"
    install_cmd: "pip install -r requirements.txt"
    start_cmd: "python main.py"
    health_check: "curl -fsS http://localhost:8188/"

  - name: comfyui
    repo: "https://github.com/comfyanonymous/ComfyUI.git"
    install_dir: "~/.nirvana/services/comfyui"
    install_cmd: "pip install -r requirements.txt"
    start_cmd: "python main.py"
    health_check: "curl -fsS http://127.0.0.1:8188/system_stats"

# ─────────────────────────────────────────────────────────────
# ComfyUI custom nodes (clones into ~/comfyui/custom_nodes/)
# ─────────────────────────────────────────────────────────────
custom_nodes:
  - name: ComfyUI-WanVideoWrapper
    repo: "https://github.com/kijai/ComfyUI-WanVideoWrapper.git"
    install_to: "~/.nirvana/services/comfyui/custom_nodes"

# ─────────────────────────────────────────────────────────────
# Model downloads (require user confirmation if >1GB)
# ─────────────────────────────────────────────────────────────
models:
  - name: WAN2.1-T2V-14B
    source: huggingface
    repo: "Wan-AI/Wan2.1-T2V-14B"
    install_to: "~/.nirvana/services/comfyui/models/checkpoints"
    size_gb: 28

# ─────────────────────────────────────────────────────────────
# Env vars (checked only — never written)
# ─────────────────────────────────────────────────────────────
env_vars:
  - name: GEMINI_API_KEY
    required: false
    description: "Used by Pixelle-Video as default LLM. Optional — Ollama works as local fallback."

# ─────────────────────────────────────────────────────────────
# Post-install hooks (run after everything else)
# ─────────────────────────────────────────────────────────────
post_install:
  - "bun ${NIRVANA_SKILLS_DIR:-$HOME/.nirvana/skills}/squads/scripts/index-squads.ts --quiet"
