# Squad dependency manifest (sidecar to squad.yaml).
# When user activates this squad, the activator walks each section in order,
# checks if the item is already present, and installs only what's missing.
#
# Place at <squad>/dependencies.yaml. If the file is absent, the squad is
# assumed self-contained (no external installs needed).
#
# CLI:
#   bun ~/.nirvana/skills/squads/scripts/activate-squad.ts <slug>
#   bun ~/.nirvana/skills/squads/scripts/activate-squad.ts <slug> --dry-run
#   bun ~/.nirvana/skills/squads/scripts/activate-squad.ts <slug> --confirm-heavy
#
# Templates: copy this file and fill in only the sections that apply.

schema_version: "1.0"

# ─────────────────────────────────────────────────────────────
# System tools (CLIs that must be on PATH)
# ─────────────────────────────────────────────────────────────
system:
  - name: ffmpeg
    check: "ffmpeg -version"
    install:
      darwin: "brew install ffmpeg"
      linux: "sudo apt install -y ffmpeg"
      win32: "choco install ffmpeg -y"

  - name: git
    check: "git --version"
    install:
      darwin: "brew install git"
      linux: "sudo apt install -y git"

# ─────────────────────────────────────────────────────────────
# Python packages (in the squad's runtime, not a venv)
# ─────────────────────────────────────────────────────────────
python:
  manager: pip      # uv | pip
  packages:
    - "openai>=2.0.0"
    - "pydantic>=2.0.0"

# ─────────────────────────────────────────────────────────────
# Node packages (uncommon at squad level — usually skill-level)
# ─────────────────────────────────────────────────────────────
# node:
#   manager: npm
#   cwd: "${SQUADS_DIR}/<slug>"
#   packages:
#     - "yaml@^2"

# ─────────────────────────────────────────────────────────────
# External services (long-running daemons the squad calls)
# Activator clones + installs but does NOT start them.
# ─────────────────────────────────────────────────────────────
services:
  - name: comfyui
    repo: "https://github.com/comfyanonymous/ComfyUI.git"
    install_dir: "~/comfyui"
    install_cmd: "pip install -r requirements.txt"
    start_cmd: "python main.py"
    health_check: "curl -fsS http://localhost:8188/"

  - name: comfyui
    repo: "https://github.com/comfyanonymous/ComfyUI.git"
    install_dir: "~/comfyui"
    install_cmd: "pip install -r requirements.txt"
    start_cmd: "python main.py"
    health_check: "curl -fsS http://127.0.0.1:8188/system_stats"

# ─────────────────────────────────────────────────────────────
# ComfyUI custom nodes (clones into ~/comfyui/custom_nodes/)
# ─────────────────────────────────────────────────────────────
custom_nodes:
  - name: ComfyUI-WanVideoWrapper
    repo: "https://github.com/kijai/ComfyUI-WanVideoWrapper.git"
    install_to: "~/comfyui/custom_nodes"

# ─────────────────────────────────────────────────────────────
# Model downloads (require user confirmation if >1GB)
# ─────────────────────────────────────────────────────────────
models:
  - name: WAN2.1-T2V-14B
    source: huggingface
    repo: "Wan-AI/Wan2.1-T2V-14B"
    install_to: "~/comfyui/models/checkpoints"
    size_gb: 28

# ─────────────────────────────────────────────────────────────
# Env vars (checked only — never written)
# ─────────────────────────────────────────────────────────────
env_vars:
  - name: GEMINI_API_KEY
    required: false
    description: "Used by Pixelle-Video as default LLM. Optional — Ollama works as local fallback."

# ─────────────────────────────────────────────────────────────
# External desktop applications (consumed by `nrv install <pack>`)
# Pack install aggregates these declarations across bundled squads and
# already-installed required squads. Preflight executes no declared commands
# and returns a SHA-256 digest. Installation runs only when the user accepts
# that exact digest. Without a decision, optional-only plans install the parent
# pack degraded and run no external commands; required apps remain fail-closed.
# Commands are executable + argv, never shell strings. Secret-bearing argv,
# control characters, and non-HTTPS or credentialed URLs are rejected. Use
# stable provider-neutral ids.
# ─────────────────────────────────────────────────────────────
external_apps:
  - id: vendor.application
    name: Application
    description: "Desktop runtime used by this squad."
    required: false
    capability: automation.desktop
    license: MIT
    homepage: "https://example.com/application"
    source: "https://github.com/vendor/application"
    platforms: [win32, darwin]
    permissions: [accessibility, screen-recording]
    compatibility:
      requirement: ">=1.4.0 <2.0.0"
      check:
        command: application
        args: [status, --json]
    presence_check:
      command: application
      args: [--version]
    install:
      win32:
        command: winget
        args: [install, --id, Vendor.Application, --exact]
      darwin:
        command: brew
        args: [install, --cask, application]

# ─────────────────────────────────────────────────────────────
# Post-install hooks (run after everything else)
# ─────────────────────────────────────────────────────────────
post_install:
  - "bun ${NIRVANA_SKILLS_DIR:-$HOME/.nirvana/skills}/squads/scripts/index-squads.ts --quiet"
